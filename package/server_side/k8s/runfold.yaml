apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runfold-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runfold-server
  labels:
    app.kubernetes.io/name: runfold-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runfold-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runfold-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: registry.example.com/runfold/runfold-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8383
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/runfold
              readOnly: true
            - name: data
              mountPath: /var/lib/runfold
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: runfold-config
            defaultMode: 0400
        - name: data
          persistentVolumeClaim:
            claimName: runfold-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runfold-server
  labels:
    app.kubernetes.io/name: runfold-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: runfold-server
  ports:
    - name: http
      port: 8383
      targetPort: http
