server:
  host: 0.0.0.0
  port: 8383

data:
  directory: /var/lib/runfold

cors:
  allowed_origins:
    - https://runfold.example.com

provider:
  base_url: http://openai-compatible-service:11434/v1
  api_key: REPLACE_ME
  embedding_model: REPLACE_ME
  embedding_dimensions: 1536
  embed_batch_size: 16
  timeout_seconds: 30
  max_retries: 2

agent:
  model: qwen3.8-27b-uncensored-q6_k-mtp
  context_window_tokens: 1240000
  provider_concurrency: 1
  input_tokens: 70000
  output_tokens: 50000
  thinking_tokens: 40000
  compression_threshold: 0.8
  thinking_level_options: ["low", "medium", "xhigh"]
  default_thinking_level: ""

rag:
  chunk_size: 1000
  chunk_overlap: 100
  upload_max_bytes: 524288000
  extract_max_characters: 2000000
  pdf_max_pages: 500
  docx_max_uncompressed_bytes: 104857600

auth:
  session_ttl_seconds: 86400
  bootstrap_admin:
    username: admin
    password: REPLACE_ME

limits:
  default_max_documents: 1000
  default_max_storage_bytes: 10737418240
  default_monthly_embedding_tokens: 100000000
  default_monthly_agent_tokens: 10000000
