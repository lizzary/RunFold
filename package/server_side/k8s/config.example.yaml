server:
  host: 0.0.0.0
  port: 8383

data:
  directory: /var/lib/runfold

cors:
  allowed_origins:
    - https://runfold.example.com

provider:
  base_url: http://embedding-service:11434/v1
  api_key: REPLACE_ME
  embedding_model: REPLACE_ME
  embedding_dimensions: 1536
  embed_batch_size: 16
  timeout_seconds: 30
  max_retries: 2

rag:
  chunk_size: 1000
  chunk_overlap: 100
  upload_max_bytes: 20971520
  extract_max_characters: 2000000
  pdf_max_pages: 500
  docx_max_uncompressed_bytes: 104857600

auth:
  session_ttl_seconds: 86400
  bootstrap_admin:
    username: admin
    password: REPLACE_ME

limits:
  default_max_documents: 1000
  default_max_storage_bytes: 10737418240
  default_monthly_embedding_tokens: 100000000
