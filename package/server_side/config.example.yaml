server:
  host: 127.0.0.1
  port: 8000

data:
  directory: D:/RunFoldData

cors:
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000

provider:
  base_url: http://119.247.22.177:1395/v1
  api_key: ""
  embedding_model: text-embedding-nomic-embed-text-v1.5
  embedding_dimensions: 768
  embed_batch_size: 16
  timeout_seconds: 30
  max_retries: 2

agent:
  model: qwen3.8-27b-uncensored-q6_k-mtp
  context_window_tokens: 1240000
  provider_concurrency: 1
  input_tokens: 70000
  output_tokens: 50000
  thinking_tokens: 40000

rag:
  chunk_size: 1000
  chunk_overlap: 100
  upload_max_bytes: 20971520
  extract_max_characters: 2000000
  pdf_max_pages: 500
  docx_max_uncompressed_bytes: 104857600

auth:
  session_ttl_seconds: 86400
  bootstrap_admin:
    username: admin
    password: replace-with-at-least-12-characters

limits:
  default_max_documents: 1000
  default_max_storage_bytes: 10737418240
  default_monthly_embedding_tokens: 100000000
  default_monthly_agent_tokens: 10000000
